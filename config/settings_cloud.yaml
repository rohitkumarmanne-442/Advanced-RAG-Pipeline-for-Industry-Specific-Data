# Cloud Deployment Configuration
# Uses Groq API (free tier) instead of local Ollama

project:
  name: "Advanced RAG Pipeline"
  domain: "financial"
  version: "1.0.0"

# Document Ingestion Settings
ingestion:
  supported_formats: [".pdf", ".txt", ".html", ".json"]
  pdf_parser: "unstructured"
  extract_tables: true
  extract_images: false
  ocr_enabled: false
  max_file_size_mb: 50

# Chunking Configuration
chunking:
  strategy: "semantic"
  semantic:
    embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
    breakpoint_threshold: 0.3
    min_chunk_size: 100
    max_chunk_size: 1500
  recursive:
    chunk_size: 512
    chunk_overlap: 50
    separators: ["\n\n", "\n", ". ", " "]

# Embedding Configuration
embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  model_kwargs:
    device: "cpu"
  encode_kwargs:
    normalize_embeddings: true
    batch_size: 32
  dimension: 384
  fine_tune:
    enabled: false

# Vector Store Configuration
vectorstore:
  backend: "chroma"
  chroma:
    collection_name: "sec_filings"
    persist_directory: "data/vectorstore/chroma"
    distance_metric: "cosine"

# Retrieval Configuration
retrieval:
  top_k: 10
  final_top_k: 5
  strategies:
    - "dense"
    - "sparse"
  fusion:
    method: "reciprocal_rank"
    rrf_k: 60
    weights:
      dense: 0.7
      sparse: 0.3
  reranker:
    enabled: false
    model: "BAAI/bge-reranker-large"
    top_n: 5

# LLM Configuration - Groq Cloud (Free Tier)
llm:
  provider: "groq"
  model_name: "llama-3.1-8b-instant"
  temperature: 0.1
  max_tokens: 2048
  context_window: 8192
  system_prompt: |
    You are a financial analyst assistant specializing in SEC filings analysis.
    Answer questions based strictly on the provided context.
    If the information is not in the context, say "I cannot find this information in the provided documents."
    Always cite the specific section or document you're referencing.

# Evaluation Configuration
evaluation:
  framework: "ragas"
  metrics:
    - "faithfulness"
    - "answer_relevancy"
    - "context_precision"
    - "context_recall"
  ground_truth_path: "data/ground_truth/qa_pairs.json"
  num_samples: 50
  hallucination_threshold: 0.05

# Logging
logging:
  level: "INFO"
  file: "logs/pipeline.log"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
