# .streamlit/secrets.toml
# ---------------------------------------------------------------
# Template — copy to your local environment and fill in real values.
# This file is listed in .gitignore and must NEVER be committed
# with actual credentials.
# ---------------------------------------------------------------

# --- Option A: Formspree (recommended for Streamlit Cloud) ---
# Sign up at https://formspree.io and create a form to get an endpoint.
# FORMSPREE_URL = "https://formspree.io/f/YOUR_FORM_ID"

# --- Option B: SMTP ---
# SMTP_HOST     = "smtp.example.com"
# SMTP_PORT     = "587"
# SMTP_USER     = "sender@example.com"
# SMTP_PASSWORD = "your-smtp-password"
# CONTACT_EMAIL = "recipient@example.com"
